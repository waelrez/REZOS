<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REZ OS V1.4</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{
height:100vh;
overflow:hidden;
background:url("https://images.wallpapers.com/windows11/windows11-4k-blue.jpg") center/cover no-repeat;
color:white;
transition:0.3s;
}

/* BOOT */
#boot{
position:fixed;inset:0;background:black;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
z-index:9999;color:white;
}
.loader{
width:60px;height:60px;border:5px solid #333;
border-top:5px solid #3b82f6;border-radius:50%;
animation:spin 1s linear infinite;margin-top:20px;
}
@keyframes spin{100%{transform:rotate(360deg)}}

/* LOCK */
#lock{
position:fixed;inset:0;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(20px);
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:5000;
}
#lock button{
padding:10px 20px;border:none;border-radius:10px;
background:#2563eb;color:white;cursor:pointer;
}

/* DESKTOP */
.desktop{position:absolute;inset:0}

/* TASKBAR */
.taskbar{
position:absolute;bottom:10px;left:50%;
transform:translateX(-50%);
width:700px;height:60px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(20px);
border-radius:20px;
display:flex;align-items:center;
justify-content:center;gap:25px;
}
.taskbar img{width:30px;cursor:pointer}
.taskbar img.active{filter:brightness(2)}
.clock{position:absolute;right:20px;font-size:13px}

/* START */
.start{
position:absolute;bottom:85px;left:50%;
transform:translateX(-50%) scale(0);
width:500px;height:500px;
background:rgba(20,20,20,0.95);
border-radius:20px;padding:20px;
transition:0.3s;overflow:auto;
}
.start.active{transform:translateX(-50%) scale(1)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.app{text-align:center;cursor:pointer}
.app img{width:45px}

/* WINDOWS */
.window{
position:absolute;top:100px;left:200px;
width:800px;height:500px;
background:#111;border-radius:15px;
display:none;flex-direction:column;
overflow:hidden;
}
.header{
height:45px;background:#222;
display:flex;align-items:center;
justify-content:space-between;
padding:0 15px;cursor:move;
}
.controls span{margin-left:10px;cursor:pointer}
.content{flex:1;padding:15px;overflow:auto}

/* TOAST */
.toast{
position:absolute;bottom:100px;right:20px;
background:#222;padding:15px;border-radius:10px;
display:none;
}

/* RESPONSIVE */
@media(max-width:900px){
.window{width:95%;left:2.5%}
.taskbar{width:95%}
.start{width:95%}
}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
<h1>REZ OS</h1>
<svg width="80" height="80" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="40" stroke="#3b82f6" stroke-width="6" fill="none"/>
<text x="50%" y="55%" text-anchor="middle" fill="white" font-size="30">R</text>
</svg>
<div class="loader"></div>
</div>

<!-- LOCK -->
<div id="lock">
<h1>Welcome to REZ OS V1.4</h1>
<button onclick="unlock()">Enter</button>
</div>

<div class="desktop">

<!-- START -->
<div class="start" id="startMenu">
<div class="grid">
<div class="app" onclick="openWin('files')">
<img src="https://cdn-icons-png.flaticon.com/512/716/716784.png"><div>Files</div>
</div>
<div class="app" onclick="openWin('browser')">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png"><div>Browser</div>
</div>
<div class="app" onclick="openWin('calc')">
<img src="https://cdn-icons-png.flaticon.com/512/992/992651.png"><div>Calc</div>
</div>
<div class="app" onclick="openWin('notes')">
<img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png"><div>Notes</div>
</div>
</div>
</div>

<!-- TASKBAR -->
<div class="taskbar">
<img src="https://cdn-icons-png.flaticon.com/512/1828/1828859.png" onclick="toggleStart()">
<img src="https://cdn-icons-png.flaticon.com/512/716/716784.png" onclick="openWin('files')">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" onclick="openWin('browser')">
<img src="https://cdn-icons-png.flaticon.com/512/992/992651.png" onclick="openWin('calc')">
<div class="clock" id="clock"></div>
</div>

<div class="toast" id="toast">App Opened</div>

</div>

<!-- FILES -->
<div class="window" id="files">
<div class="header">File Explorer
<div class="controls">
<span onclick="minimize('files')">—</span>
<span onclick="maximize('files')">⬜</span>
<span onclick="closeWin('files')">✕</span>
</div></div>
<div class="content">📁 Documents<br>📁 Downloads<br>📄 rez.sys</div>
</div>

<!-- BROWSER -->
<div class="window" id="browser">
<div class="header">Browser
<div class="controls">
<span onclick="minimize('browser')">—</span>
<span onclick="maximize('browser')">⬜</span>
<span onclick="closeWin('browser')">✕</span>
</div></div>
<div class="content">
<iframe src="https://example.com" style="width:100%;height:100%;border:none"></iframe>
</div>
</div>

<!-- CALC -->
<div class="window" id="calc">
<div class="header">Calculator
<div class="controls">
<span onclick="closeWin('calc')">✕</span>
</div></div>
<div class="content">
<input id="calcInput" style="width:100%;padding:10px">
<button onclick="calculate()">=</button>
</div>
</div>

<!-- NOTES -->
<div class="window" id="notes">
<div class="header">Notes
<div class="controls">
<span onclick="closeWin('notes')">✕</span>
</div></div>
<div class="content">
<textarea id="noteArea" style="width:100%;height:100%"></textarea>
</div>
</div>

<script>

let z=1;

/* Boot to Lock */
setTimeout(()=>{
boot.style.display="none";
lock.style.display="flex";
},2500);

function unlock(){
lock.style.display="none";
showToast("System Ready");
}

/* Start */
function toggleStart(){
startMenu.classList.toggle("active");
}

/* Clock */
function updateClock(){
let d=new Date();
clock.innerHTML=d.toLocaleTimeString()+"<br>"+d.toLocaleDateString();
}
setInterval(updateClock,1000);updateClock();

/* Windows */
function openWin(id){
let w=document.getElementById(id);
w.style.display="flex";
w.style.zIndex=++z;
showToast("Opened "+id);
}
function closeWin(id){
document.getElementById(id).style.display="none";
}
function minimize(id){
document.getElementById(id).style.display="none";
}
function maximize(id){
let w=document.getElementById(id);
w.style.top="0";
w.style.left="0";
w.style.width="100%";
w.style.height="100%";
}

/* Drag */
document.querySelectorAll(".window").forEach(win=>{
let header=win.querySelector(".header");
header.onmousedown=function(e){
win.style.zIndex=++z;
let offsetX=e.clientX-win.offsetLeft;
let offsetY=e.clientY-win.offsetTop;
document.onmousemove=function(e){
win.style.left=e.clientX-offsetX+"px";
win.style.top=e.clientY-offsetY+"px";
}
document.onmouseup=function(){document.onmousemove=null}
}
});

/* Calculator */
function calculate(){
let val=document.getElementById("calcInput").value;
try{
document.getElementById("calcInput").value=eval(val);
}catch{alert("Error")}
}

/* Notes save */
noteArea.value=localStorage.getItem("rez_notes")||"";
noteArea.oninput=function(){
localStorage.setItem("rez_notes",noteArea.value);
}

/* Toast */
function showToast(msg){
toast.innerText=msg;
toast.style.display="block";
setTimeout(()=>toast.style.display="none",2000);
}

</script>
</body>
</html>
