<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REZ OS V1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{overflow:hidden;height:100vh;background:#0f172a;color:white}

/* BOOT SCREEN */
#boot{
position:fixed;inset:0;
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;align-items:center;justify-content:center;
flex-direction:column;
z-index:9999;
}
.loader{
width:60px;height:60px;
border:5px solid #334155;
border-top:5px solid #38bdf8;
border-radius:50%;
animation:spin 1s linear infinite;
margin-top:20px;
}
@keyframes spin{100%{transform:rotate(360deg)}}

/* LOGIN */
#login{
position:fixed;inset:0;
background:linear-gradient(135deg,#1e293b,#0f172a);
display:none;
align-items:center;justify-content:center;
flex-direction:column;
}
#login input{
padding:10px;border:none;border-radius:10px;
margin-top:10px;
}
#login button{
margin-top:10px;padding:10px 20px;
border:none;border-radius:10px;
background:#38bdf8;color:black;font-weight:bold;
cursor:pointer;
}

/* DESKTOP */
#desktop{
display:none;
position:absolute;inset:0;
background:linear-gradient(135deg,#1e3a8a,#0f172a);
background-size:400% 400%;
animation:bg 15s infinite alternate;
}
@keyframes bg{
0%{background-position:left}
100%{background-position:right}
}

.icon{
width:80px;text-align:center;margin:20px;
cursor:pointer;
}
.icon:hover{transform:scale(1.1)}
.icons{display:flex;flex-direction:column}

/* TASKBAR */
.taskbar{
position:absolute;bottom:0;left:0;right:0;
height:55px;background:rgba(0,0,0,0.4);
backdrop-filter:blur(20px);
display:flex;align-items:center;justify-content:center;
gap:20px;
}
.start{cursor:pointer;font-size:22px}
.clock{position:absolute;right:20px}

/* START MENU */
#startMenu{
position:absolute;bottom:70px;left:50%;
transform:translateX(-50%) scale(0);
width:300px;height:350px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(20px);
border-radius:20px;padding:20px;
transition:0.3s;
}
#startMenu.active{transform:translateX(-50%) scale(1)}
.app{padding:10px;background:rgba(255,255,255,0.1);
margin-bottom:10px;border-radius:10px;cursor:pointer}

/* WINDOWS */
.window{
position:absolute;top:120px;left:200px;
width:500px;height:350px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(20px);
border-radius:15px;
display:none;
flex-direction:column;
}
.header{
height:40px;background:rgba(255,255,255,0.1);
display:flex;align-items:center;justify-content:space-between;
padding:0 10px;cursor:move;
}
.controls span{
margin-left:10px;cursor:pointer;
}
.content{flex:1;padding:15px;overflow:auto}

/* TERMINAL */
#terminalOutput{
font-family:monospace;font-size:14px;
}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
<h1>REZ OS V1.1</h1>
<div class="loader"></div>
</div>

<!-- LOGIN -->
<div id="login">
<h2>Welcome Wael</h2>
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="enter()">Login</button>
</div>

<!-- DESKTOP -->
<div id="desktop">
<div class="icons">
<div class="icon" onclick="openWin('about')">💻<br>About</div>
<div class="icon" onclick="openWin('files')">📁<br>Files</div>
<div class="icon" onclick="openWin('terminal')">🖥<br>Terminal</div>
</div>

<div class="taskbar">
<div class="start" onclick="toggleStart()">⊞</div>
REZ OS V1.1
<div class="clock" id="clock"></div>
</div>

<div id="startMenu">
<div class="app" onclick="openWin('about')">About</div>
<div class="app" onclick="openWin('files')">Files</div>
<div class="app" onclick="openWin('terminal')">Terminal</div>
</div>
</div>

<!-- WINDOWS -->

<div class="window" id="about">
<div class="header">About<div class="controls">
<span onclick="minWin('about')">—</span>
<span onclick="maxWin('about')">⬜</span>
<span onclick="closeWin('about')">✕</span>
</div></div>
<div class="content">
<h2>REZ OS V1.1</h2>
<p>Developer: Wael</p>
<p>Year: 2026</p>
<p>Modern Glass UI System</p>
</div>
</div>

<div class="window" id="files">
<div class="header">File Explorer<div class="controls">
<span onclick="minWin('files')">—</span>
<span onclick="maxWin('files')">⬜</span>
<span onclick="closeWin('files')">✕</span>
</div></div>
<div class="content">
📁 Documents<br>
📁 Downloads<br>
📄 rez_config.sys<br>
</div>
</div>

<div class="window" id="terminal">
<div class="header">Terminal<div class="controls">
<span onclick="minWin('terminal')">—</span>
<span onclick="maxWin('terminal')">⬜</span>
<span onclick="closeWin('terminal')">✕</span>
</div></div>
<div class="content">
<div id="terminalOutput">REZ Terminal V1.1<br></div>
<input type="text" id="cmd" style="width:100%;background:black;color:lime;border:none;padding:5px" placeholder="type command">
</div>
</div>

<script>

/* Boot */
setTimeout(()=>{
boot.style.display="none";
login.style.display="flex";
},2500)

/* Login */
function enter(){
if(pass.value==="1234"){
login.style.display="none";
desktop.style.display="block";
}else{
alert("Wrong password");
}
}

/* Start Menu */
function toggleStart(){
startMenu.classList.toggle("active");
}

/* Clock */
function updateClock(){
clock.innerText=new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);updateClock();

/* Windows */
function openWin(id){document.getElementById(id).style.display="flex"}
function closeWin(id){document.getElementById(id).style.display="none"}
function minWin(id){document.getElementById(id).style.display="none"}
function maxWin(id){
let w=document.getElementById(id);
w.style.top="0";w.style.left="0";
w.style.width="100%";w.style.height="100%";
}

/* Drag */
document.querySelectorAll(".window").forEach(win=>{
let header=win.querySelector(".header");
header.onmousedown=function(e){
let offsetX=e.clientX-win.offsetLeft;
let offsetY=e.clientY-win.offsetTop;
document.onmousemove=function(e){
win.style.left=e.clientX-offsetX+"px";
win.style.top=e.clientY-offsetY+"px";
}
document.onmouseup=function(){document.onmousemove=null}
}
});

/* Terminal */
cmd.addEventListener("keydown",function(e){
if(e.key==="Enter"){
let output=document.getElementById("terminalOutput");
let val=this.value;
output.innerHTML+="<br>> "+val;
if(val==="help") output.innerHTML+="<br>about, clear, version";
if(val==="version") output.innerHTML+="<br>REZ OS V1.1";
if(val==="clear") output.innerHTML="";
this.value="";
}
});

</script>
</body>
</html>
